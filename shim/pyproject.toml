# The final release of the old name. It has no code: installing or upgrading
# qsp-mcp installs qsp-client, which also provides the old `qsp-mcp` command.
# Published once, by .github/workflows/publish-shim.yml.
[project]
name = "qsp-mcp"
version = "0.3.0"
description = "Renamed to qsp-client. Installing qsp-mcp installs qsp-client."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Greg Beam, KI7MT", email = "ki7mt@yahoo.com"}]
requires-python = ">=3.10"
dependencies = ["qsp-client>=0.3.0"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/qso-graph/qsp-client"
Repository = "https://github.com/qso-graph/qsp-client"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["README.md", "pyproject.toml"]
