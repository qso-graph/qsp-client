[project]
name = "qsp-client"
version = "0.5.1"
description = "MCP tool relay for local LLM inference — bridge any OpenAI-compatible endpoint to MCP servers"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Greg Beam, KI7MT", email = "maintainers@qso-graph.io"}]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    # The ADIF models (qsp_client.adif.models); mcp already pulls it in.
    "pydantic>=2",
    # ADIF reading (qsp-adif-convert), shared with the logbook servers. Standard library only.
    "qso-graph-lib>=0.2.0",
]
keywords = [
    "amateur-radio", "ham-radio", "mcp", "model-context-protocol",
    "llm", "function-calling", "tool-use", "local-inference",
    "llama-cpp", "ollama", "vllm", "sglang", "qsp",
    "ai", "cli", "openai-compatible", "propagation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://qso-graph.io"
Documentation = "https://qso-graph.io/servers/qsp-client/"
Repository = "https://github.com/qso-graph/qsp-client"
Issues = "https://github.com/qso-graph/qsp-client/issues"

[project.scripts]
qsp-client = "qsp_client.cli:main"
# The old command name, kept while users move over.
qsp-mcp = "qsp_client.cli:main_renamed"
# ADIF (.adi) to JSON/NDJSON, moved here from adif-mcp.
qsp-adif-convert = "qsp_client.adif.convert:main"


[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6.8", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qsp_client"]

# Lint and type settings follow adif-mcp, the reference for every qso-graph
# Python repo (qso-graph-devel#66). Copied rather than invented so the repos do
# not each grow a style of their own.
[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 95
extend-exclude = [".venv", "dist", "build", ".eggs", ".pytest_cache", "site"]

[tool.ruff.lint]
# F and I are the rules that find defects: an unused import, an undefined name,
# an import block out of order. They run here from the start.
#
# E501 is a width, and it is adif-mcp's width — these repos were not written to
# it. On cq-zones-mcp it reported 39 lines and not one of them was a defect, so
# it is deferred to a pass of its own rather than reflowing several hundred
# lines of prose across sixteen repos (qso-graph-devel#70).
#
# Six of those 39 will not be reflowed at all, whenever that pass happens.
# They are long because they name a publisher's field exactly —
# `pas["Adif"]["Enumerations"]["Primary_Administrative_Subdivision"]["Records"]`
# — and this project's rule is that the owner of a list is its authority, so we
# use ADIF's names and not shorter ones of our own. There the length is the
# correctness.
select = ["E", "F", "I"]
ignore = []
fixable = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
