[project]
name = "qsp-client"
version = "0.3.3"
description = "MCP tool relay for local LLM inference — bridge any OpenAI-compatible endpoint to MCP servers"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Greg Beam, KI7MT", email = "ki7mt@yahoo.com"}]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]
keywords = [
    "amateur-radio", "ham-radio", "mcp", "model-context-protocol",
    "llm", "function-calling", "tool-use", "local-inference",
    "llama-cpp", "ollama", "vllm", "sglang", "qsp",
    "ai", "cli", "openai-compatible", "propagation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://qso-graph.io"
Documentation = "https://qso-graph.io/servers/qsp-client/"
Repository = "https://github.com/qso-graph/qsp-client"
Issues = "https://github.com/qso-graph/qsp-client/issues"

[project.scripts]
qsp-client = "qsp_client.cli:main"
# The old command name, kept while users move over.
qsp-mcp = "qsp_client.cli:main_renamed"


[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qsp_client"]
